{% load i18n static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% trans "You are offline" %}</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Hind Siliguri", sans-serif; background: #f4f5f7; color: #1f2430; text-align: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 360px; }
  img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
  button { background: #f85606; color: #fff; border: 0; padding: 12px 28px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
</style></head>
<body><div class="box">
  <img src="{% static 'img/icons/icon-192.png' %}" alt="">
  <h1>{% trans "You are offline" %}</h1>
  <p>{% trans "Please check your internet connection and try again." %}</p>
  <button onclick="location.reload()">{% trans "Try again" %}</button>
</div></body></html>
