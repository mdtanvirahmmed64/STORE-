{% extends "accounts/account_base.html" %}
{% load i18n %}
{% block title %}{% trans "Change Password" %} | {{ site.site_name }}{% endblock %}
{% block account_content %}
<section class="card card-body" style="max-width:520px">
  <h1 class="card-title">{% trans "Change Password" %}</h1>
  <form method="post">{% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">{% trans "Update password" %}</button>
  </form>
</section>
{% endblock %}
