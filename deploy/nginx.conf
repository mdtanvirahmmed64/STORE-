# /etc/nginx/sites-available/shopbd
server {
    listen 80;
    server_name example.com www.example.com;   # আপনার ডোমেইন দিন

    client_max_body_size 20M;

    location /static/ { alias /var/www/shopbd/staticfiles/; expires 30d; }
    location /media/  { alias /var/www/shopbd/media/;       expires 30d; }

    location / {
        proxy_pass http://unix:/run/shopbd.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
